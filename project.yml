# The Drowning — XcodeGen spec.  Regenerate with:  xcodegen generate
# Then (once):  Cursor command palette → "Sweetpad: Generate Build Server Config"
#
# Direct distribution (no Mac App Store): no App Sandbox, Hardened Runtime on,
# App Group is Team-ID-prefixed (required for non-MAS macOS apps).

name: TheDrowning

options:
  bundleIdPrefix: com.panjas
  deploymentTarget:
    macOS: '14.0' # floor is 14: @Observable (Observation) + SMAppService(13+)
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 8J2G689FCZ
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES # required for notarization
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.6.38'
    CURRENT_PROJECT_VERSION: '59'
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application

packages:
  DrownedCore:
    path: DrownedCore

targets:
  # ---- main windowed app ------------------------------------------------
  TheDrowning:
    type: application
    platform: macOS
    sources: [App/TheDrowning]
    dependencies:
      - package: DrownedCore
        product: DrownedUI
      - package: DrownedCore
        product: DrownedSync
      - package: DrownedCore
        product: DrownedStore
      - package: DrownedCore
        product: DrownedNotify
      - package: DrownedCore
        product: DrownedModel
      # Embed the agent .app + code-sign-on-copy into the main bundle.
      # VERIFY after first build that it lands at:
      #   The Drowning.app/Contents/Library/LaunchAgents/TheDrowningAgent.app
      # (the wrapper+subpath base is the one knob to confirm; the plist's
      #  BundleProgram path must match wherever it ends up.)
      - target: TheDrowningAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_NAME: The Drowning
        PRODUCT_BUNDLE_IDENTIFIER: com.panjas.thedrowning
        CODE_SIGN_ENTITLEMENTS: App/TheDrowning/TheDrowning.entitlements
    info:
      path: App/TheDrowning/Info.plist
      properties:
        LSMinimumSystemVersion: '14.0'
        LSApplicationCategoryType: public.app-category.reference
        CFBundleURLTypes:
          - CFBundleURLName: com.panjas.thedrowning
            CFBundleURLSchemes: [thedrowning] # notification-tap deep link
    postBuildScripts:
      - name: Copy LaunchAgent Plist
        script: |
          set -euo pipefail
          destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          install -d "${destination}"
          install -m 0644 "${SRCROOT}/LaunchAgents/com.panjas.thedrowning.agent.plist" "${destination}/com.panjas.thedrowning.agent.plist"
        inputFiles:
          - $(SRCROOT)/LaunchAgents/com.panjas.thedrowning.agent.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.panjas.thedrowning.agent.plist

  # ---- headless LaunchAgent helper (LSUIElement app bundle) --------------
  TheDrowningAgent:
    type: application
    platform: macOS
    sources:
      - App/TheDrowningAgent
      - App/TheDrowning/Assets.xcassets
    dependencies:
      - package: DrownedCore
        product: DrownedSync
      - package: DrownedCore
        product: DrownedStore
      - package: DrownedCore
        product: DrownedNotify
      - package: DrownedCore
        product: DrownedModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panjas.thedrowning.agent
        CODE_SIGN_ENTITLEMENTS: App/TheDrowningAgent/TheDrowningAgent.entitlements
        SKIP_INSTALL: YES
    info:
      path: App/TheDrowningAgent/Info.plist
      properties:
        LSMinimumSystemVersion: '14.0'
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true # agent: no Dock icon, can still post notifications

schemes:
  TheDrowning:
    build:
      targets: { TheDrowning: all }
    run: { config: Debug }
  TheDrowningAgent: # run this directly from Cursor to debug poll to notify logic
    build:
      targets: { TheDrowningAgent: all }
    run: { config: Debug }
